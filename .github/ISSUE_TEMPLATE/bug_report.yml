name: Bug report
description: Report an incorrect plan or validation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Planner input
      description: Do not include credentials, presigned URLs, or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node.js 22.0.0
